[package]
name = "sistem-jedan"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io"] }
rquickjs = { version = "0.14", features = ["allocator", "futures", "parallel"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "io-std", "sync", "time"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
